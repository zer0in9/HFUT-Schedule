name: iOS IPA Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      IOS_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      # Kotlin 2.2.21 supports Xcode 26.0; don't inherit runner Xcode upgrades.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          [[ "$IOS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected version X.Y.Z'; exit 1; }
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcrun simctl list > /dev/null
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache/restore@v4
        id: konan-cache
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.2.21-compose-1.9.3-xcode-26.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test shared business logic and compile shared UI
        run: bash ./gradlew -p multiplatform :core:jvmTest :composeApp:compileKotlinJvm --stacktrace
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Prepare iOS 26 simulators
        timeout-minutes: 15
        shell: bash
        run: |
          # Prefer the preinstalled runtime; only download if the image no longer includes it.
          if ! python3 iosApp/scripts/select-simulators.py > "$RUNNER_TEMP/ios-simulators.txt"; then
            variant=universal
            if [[ "$(uname -m)" == arm64 ]]; then variant=arm64; fi
            xcodebuild -downloadPlatform iOS -buildVersion 26.0 -architectureVariant "$variant"
            python3 iosApp/scripts/select-simulators.py > "$RUNNER_TEMP/ios-simulators.txt"
          fi
          cat "$RUNNER_TEMP/ios-simulators.txt"
      - name: Build simulator app and UI tests
        timeout-minutes: 35
        shell: bash
        run: |
          xcodebuild build-for-testing -project iosApp/HFUTSchedule.xcodeproj -scheme HFUTSchedule \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/SimulatorDerivedData \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - uses: actions/cache/save@v4
        if: steps.konan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-kotlin-2.2.21-compose-1.9.3-xcode-26.0.1
      - name: Release compiler memory before simulator tests
        run: |
          bash ./gradlew -p multiplatform --stop
          jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}' |
            while read -r compiler_pid; do kill "$compiler_pid" || true; done
      - name: Smoke test iPhone
        timeout-minutes: 15
        run: bash iosApp/scripts/test-simulator.sh iPhone
      - name: Smoke test iPad
        timeout-minutes: 15
        run: bash iosApp/scripts/test-simulator.sh iPad
      - name: Archive and package IPA for personal signing
        run: bash iosApp/scripts/package-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            iosApp/build/*.ipa
            iosApp/build/*.sha256
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            multiplatform/core/build/reports/tests/
            iosApp/build/*.xcresult
            iosApp/build/*.png
            iosApp/build/*.log
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IOS_VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist
      - name: Publish Release
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.sha256
          tag="ios-v${IOS_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/ios-release-notes.md" <<'NOTES'
          ## 聚在工大 iOS 适配预览版

          支持 iOS / iPadOS 26.0 及以上，适配 iPhone 和 iPad。

          当前功能：离线课程增删改、周次查看、学期设置和校园网站入口。
          统一认证、教务自动同步、成绩、校园卡等 Android 功能尚未迁移。

          **本 IPA 未签名，不能直接安装。请使用自己的 Apple ID / 证书和侧载工具重新签名安装。**
          无需向此仓库提供 Apple ID、密码、证书或描述文件。
          SHA-256 校验文件随包附上。
          NOTES
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/ios-release-notes.md"
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$tag" ./*.ipa ./*.sha256 \
            --target "$GITHUB_SHA" --title "iOS ${IOS_VERSION} · Build ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/ios-release-notes.md" --latest=false "${args[@]}"
