# Shared application layout for Xcode development and CI; shipping uses xtool/SwiftPM.
name: HFUTSchedule
options:
  bundleIdPrefix: com.hfut.schedule
  deploymentTarget:
    iOS: '26.0'
packages:
  HFUTCore:
    path: Packages/HFUTCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  HFUTSchedule:
    type: application
    platform: iOS
    sources:
      - path: HFUTSchedule
        excludes:
          - Info.plist
          - Resources
      - path: HFUTSchedule/Resources
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfut.schedule.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HFUTSchedule/Info.plist
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: HFUTCore
  HFUTScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HFUTScheduleTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfut.schedule.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HFUTSchedule.app/HFUTSchedule
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: HFUTSchedule
  HFUTScheduleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HFUTScheduleUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hfut.schedule.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HFUTSchedule
    dependencies:
      - target: HFUTSchedule
schemes:
  HFUTSchedule:
    build:
      targets:
        HFUTSchedule: all
    test:
      targets: [HFUTScheduleTests, HFUTScheduleUITests]
      gatherCoverageData: true
